kind = "mobile"
previewPath = "/"
title = "CyberShield India"
version = "1.0.0"
id = "artifacts/cybershield"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 21985

[services.development]
run = "pnpm --filter @workspace/cybershield run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cybershield", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/cybershield", "run", "serve" ]

[services.env]
PORT = "21985"
BASE_PATH = "/"
